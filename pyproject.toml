[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "iPod"
version = "0.0.1a2"
authors = []
description = "Python library for talking to iPod nano devices"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "gpl-3.0"
license-files = ["LICENSE"]
dependencies = [
    "pyusb~=1.3.1",
    "click~=8.3.3",
    "WMI~=1.5.1; platform_system == 'Windows'",
    'pyudev~=0.24.4; platform_system == "Linux"',
    'ordered-enum~=0.0.10'
]

[project.scripts]
ipod = "ipod.cli:cli"

[project.urls]
Homepage = "https://github.com/760ceb3b9c0ba4872cadf3ce35a7a494/iPod"
Issues = "https://github.com/760ceb3b9c0ba4872cadf3ce35a7a494/iPod/issues"